name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.20.0 httpx==0.28.1
      - name: Build release
        shell: pwsh
        env:
          ARK_RECODE_ASSIST_PYTHON: python
        run: .\scripts\build-release.ps1 -FetchDependencies
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-recode-assist-windows-x64
          path: |
            artifacts/ark-recode-assist-windows-x64.zip
            artifacts/SHA256SUMS
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/ark-recode-assist-windows-x64.zip artifacts/SHA256SUMS --generate-notes --title $env:GITHUB_REF_NAME
